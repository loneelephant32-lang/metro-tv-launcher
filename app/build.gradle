plugins { id 'com.android.application' }

// Release signing comes from keystore.properties (kept out of git). Without it, release builds
// fall back to the debug key so anyone can still build and install from source.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.metro.launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.metro.launcher'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // Debug builds are shrunk too so the installed APK stays tiny.
        debug { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    dependenciesInfo { includeInApk false; includeInBundle false }
}
